<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f5f6f3"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="./icon.svg"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"><title>墨舟 · 云端书库</title><script src="./transport.js" defer></script><script src="./app.js" defer></script></head>
<body>
<header class="shell"><a class="brand" href="./" aria-label="墨舟云端书架"><img src="./icon.svg" width="27" height="27" alt="">墨舟<span>云端书库</span></a><div class="connection"><span id="connection">正在连接</span><button id="logout" class="plain" hidden>退出</button></div></header>
<main>
<section id="login" class="login" hidden><p class="muted">你的私人书房</p><h1>打开云端书库</h1><p>打开电脑端复制的阅读链接，或粘贴阅读密钥。小说保存在云端，电脑关机后也能阅读。</p><form id="loginForm"><label for="accessKey">阅读密钥</label><input id="accessKey" type="password" autocomplete="current-password" required maxlength="128"><button class="primary" type="submit">打开书库</button></form><button id="offlineEntry" class="plain">查看已下载的小说</button></section>
<section id="shelf" hidden><div class="heading"><div><h1>我的书架</h1><p id="bookCount" class="muted"></p></div><button id="refresh">刷新书架</button></div><label class="search-label" for="search">搜索书名或作者</label><input id="search" type="search" placeholder="搜索书名 / 作者" autocomplete="off"><div id="books" class="books"></div><div id="empty" class="empty" hidden><h2>书架还空着</h2><p>在电脑端点击“云端书库”，连接后同步小说。</p></div><p class="footnote">下载整本后，可以在这台 iPad 上离线阅读。阅读位置保存在当前设备。</p></section>
<section id="reader" hidden><div class="reader-tools"><button id="back">‹ 书架</button><button id="tocToggle">目录</button><span id="readerTitle"></span><button id="settingsToggle" aria-label="阅读设置">Aa</button></div><div class="reading-layout"><aside id="toc" hidden><div class="toc-heading"><h2>章节目录</h2><button id="closeToc" aria-label="关闭目录">×</button></div><input id="chapterSearch" placeholder="查找章节" aria-label="查找章节"><nav id="chapters"></nav><button id="moreChapters" hidden>显示更多章节</button></aside><article id="paper" tabindex="-1"><p id="chapterMeta" class="muted"></p><h1 id="chapterTitle"></h1><div id="bodyText"></div></article></div><div class="reader-bottom"><button id="prev">‹ 上一节</button><div class="progress"><span id="position"></span><progress id="progress" max="100" value="0" aria-label="全书阅读进度"></progress></div><button id="next">下一节 ›</button></div>
<div id="settings" class="settings" hidden><div class="toc-heading"><h2>阅读设置</h2><button id="closeSettings" aria-label="关闭设置">×</button></div><label for="theme">阅读主题</label><select id="theme"><option value="paper">纸白</option><option value="sage">青苔</option><option value="night">夜读</option></select><label for="fontSize">字号</label><input id="fontSize" type="range" min="16" max="30" step="1" value="21"><label for="lineHeight">行距</label><input id="lineHeight" type="range" min="1.5" max="2.4" step="0.1" value="1.9"><button id="download" class="primary">下载整本，离线阅读</button><p id="downloadStatus" class="muted">离线副本仅保存在当前浏览器。</p></div></section>
</main><div id="message" role="status" aria-live="polite" hidden></div>
</body></html>
